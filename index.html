<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برنامه غذایی هفتگی</title>

  <style>
    /* ایران‌سنس: اگر روی سیستم نصب باشد از همان، وگرنه از پوشه‌ی fonts */
    @font-face { font-family: 'F-IRANSans'; font-weight: 100 200; font-display: swap;
      src: local('IRANSans UltraLight'), local('IRANSans-UltraLight'), url('fonts/iransans-200.woff2') format('woff2'), url('fonts/IRANSans_UltraLight.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 300; font-display: swap;
      src: local('IRANSans Light'), local('IRANSans-Light'), url('fonts/iransans-300.woff2') format('woff2'), url('fonts/IRANSans_Light.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 400; font-display: swap;
      src: local('IRANSans'), local('IRANSansWeb'), url('fonts/iransans-400.woff2') format('woff2'), url('fonts/IRANSans.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 500 600; font-display: swap;
      src: local('IRANSans Medium'), local('IRANSans-Medium'), url('fonts/iransans-500.woff2') format('woff2'), url('fonts/IRANSans_Medium.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 700 900; font-display: swap;
      src: local('IRANSans Bold'), local('IRANSans-Bold'), url('fonts/iransans-700.woff2') format('woff2'), url('fonts/IRANSans_Bold.ttf') format('truetype'); }

    /* یکان و نازنین یک وزن دارند؛ مرورگر نسخه‌ی پررنگ را خودش می‌سازد */
    @font-face { font-family: 'F-Yekan'; font-weight: 400; font-display: swap;
      src: url('fonts/yekan-400.woff2') format('woff2'); }

    /* شبنم */
    @font-face { font-family: 'F-Shabnam'; font-weight: 300; font-display: swap; src: url('fonts/shabnam-300.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 400; font-display: swap; src: url('fonts/shabnam-400.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 500 600; font-display: swap; src: url('fonts/shabnam-500.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 700 900; font-display: swap; src: url('fonts/shabnam-700.woff2') format('woff2'); }

    /* پینار: متغیر (وزن ۳۰۰ تا ۹۰۰) */
    @font-face { font-family: 'F-Pinar'; font-weight: 300 900; font-display: swap;
      src: url('fonts/pinar-vf.woff2') format('woff2'); }

    /* لوتوس */
    @font-face { font-family: 'F-Lotus'; font-weight: 400; font-display: swap; src: url('fonts/lotus-400.woff2') format('woff2'); }
    @font-face { font-family: 'F-Lotus'; font-weight: 700; font-display: swap; src: url('fonts/lotus-700.woff2') format('woff2'); }

    /* نازنین: یک وزن */
    @font-face { font-family: 'F-Nazanin'; font-weight: 400; font-display: swap; src: url('fonts/nazanin-400.woff2') format('woff2'); }

    /* تیتر: فقط برای عنوان */
    @font-face { font-family: 'F-Titr'; font-weight: 100 900; font-display: swap; src: url('fonts/titr-700.woff2') format('woff2'); }


    :root {
      --font-main: 'F-IRANSans', 'F-Shabnam', Tahoma, sans-serif;
      --font-title: 'F-Pinar', 'F-IRANSans', Tahoma, sans-serif;
      --font-decor: 'F-Lotus', 'F-IRANSans', Tahoma, serif;
      --font-scale: 1;

      /* پالت گرم و کرم */
      --paper: #F6F2EB;
      --ink: #2E2A22;
      --title: #45432F;
      --decor: #7A6A58;
      --label: #6F6556;
      --card-line: #BEA999;
      --rule: #D6C9BE;
      --soft: #EDE5DA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--font-main);
      background: #E4DFD8;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* نوار ابزار (در چاپ مخفی) */
    .toolbar {
      font-family: 'F-Shabnam', Tahoma, sans-serif;
      max-width: 210mm;
      margin: 14px auto 10px;
      padding: 10px 14px;
      background: #FFFFFF;
      border: 1px solid #DCD4CA;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar label { color: #6A6055; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .toolbar button, .toolbar select, .toolbar .btn-file {
      font-family: inherit; font-size: 12px; font-weight: 700;
      padding: 6px 11px; border-radius: 8px;
      border: 1px solid #BEA999; background: #FAF7F2; color: var(--ink); cursor: pointer;
    }
    .toolbar select { font-weight: 500; padding: 5px 6px; }
    .toolbar button:hover, .toolbar .btn-file:hover { background: #F1EAE0; }
    .toolbar .btn-primary { background: #45432F; border-color: #45432F; color: #FFFFFF; }
    .toolbar .btn-primary:hover { background: #57553D; }
    .toolbar input[type="file"] { display: none; }
    .save-status { font-size: 11.5px; color: #6B7A45; margin-inline-start: auto; }

    /* صفحه A4 عمودی */
    .page {
      position: relative;
      width: 210mm;
      height: 297mm;
      margin: 0 auto 24px;
      padding: 11mm 12mm 8mm;
      background:
        radial-gradient(ellipse 70mm 55mm at 100% 0%, rgba(214,196,178,0.45), transparent 70%),
        radial-gradient(ellipse 80mm 60mm at 0% 100%, rgba(214,196,178,0.40), transparent 70%),
        var(--paper);
      display: flex;
      flex-direction: column;
      gap: 4.5mm;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .page > *:not(.deco) { position: relative; z-index: 1; }
    .page * { font-family: inherit; }
    .deco { position: absolute; pointer-events: none; z-index: 0; }
    .deco.tr { top: 0; right: 0; width: 46mm; }
    .deco.bl { bottom: 0; left: 0; width: 52mm; transform: rotate(180deg); }

    /* سرصفحه */
    .head { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .main-title {
      font-family: var(--font-title) !important;
      font-size: calc(30pt * var(--font-scale));
      font-weight: 800;
      color: var(--title);
      line-height: 1.15;
      outline: none;
    }
    .sub-title {
      font-family: var(--font-decor) !important;
      font-size: calc(21pt * var(--font-scale));
      font-weight: 700;
      color: var(--decor);
      line-height: 1;
      margin-top: 0;
      outline: none;
    }
    .info {
      margin-top: 3mm;
      width: 100%;
      display: grid;
      grid-template-columns: 1.6fr 1.6fr 1fr 1fr 1fr;
      column-gap: 4mm;
      align-items: end;
    }
    .info-field { display: flex; align-items: flex-end; gap: 1.5mm; min-width: 0; }
    .info-label {
      font-size: calc(8.5pt * var(--font-scale));
      font-weight: 500;
      color: var(--label);
      white-space: nowrap;
    }
    .info-label.ltr { direction: ltr; unicode-bidi: isolate; }
    .info-value {
      flex: 1; min-width: 0;
      border-bottom: 0.3mm solid var(--rule);
      font-size: calc(9.5pt * var(--font-scale));
      font-weight: 500;
      line-height: 1.5;
      min-height: 5.5mm;
      white-space: nowrap; overflow: hidden;
      outline: none;
      text-align: center;
    }
    .divider { display: flex; align-items: center; gap: 2mm; margin-top: 3mm; width: 60mm; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 0.25mm; background: var(--rule); }
    .divider span { width: 1.6mm; height: 1.6mm; border-radius: 50%; background: var(--card-line); }

    /* کارت‌های روزها: دو ستون، چهار ردیف، از ستون راست شروع می‌شود */
    .days {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      grid-auto-flow: column;
      gap: 4.5mm 5mm;
    }
    .card {
      border: 0.35mm solid var(--card-line);
      border-radius: 5mm;
      background: rgba(255, 253, 249, 0.82);
      padding: 2mm 4mm 2.5mm;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card-title {
      font-family: var(--font-decor) !important;
      text-align: center;
      font-size: calc(16pt * var(--font-scale));
      font-weight: 700;
      color: var(--title);
      line-height: 1.25;
      margin-bottom: 0.5mm;
    }
    .meal {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 15mm 1fr;
      column-gap: 2mm;
      align-items: stretch;
    }
    .meal-label {
      font-size: calc(8pt * var(--font-scale));
      font-weight: 500;
      color: var(--label);
      align-self: end;
      padding-bottom: 0.8mm;
      white-space: nowrap;
    }
    .cell {
      border-bottom: 0.3mm solid var(--rule);
      font-size: calc(8.5pt * var(--font-scale));
      line-height: 1.32;
      padding: 0.6mm 0.5mm 0.4mm;
      outline: none;
      overflow: hidden;
      word-break: break-word;
      white-space: pre-wrap;
      display: flex;
      align-items: flex-end;
    }
    .cell:focus { background: rgba(190, 169, 153, 0.12); border-radius: 1.5mm 1.5mm 0 0; }
    .cell.overflow { box-shadow: inset 0 -2px 0 #D6964A; }

    /* کارت توصیه‌ها با خط‌های هم‌تراز با متن */
    .notes { --lh: 6.6mm; }
    .notes-content {
      flex: 1;
      min-height: 0;
      font-size: calc(9pt * var(--font-scale));
      line-height: var(--lh);
      background-image: repeating-linear-gradient(to bottom,
        transparent 0, transparent calc(var(--lh) - 0.3mm),
        var(--rule) calc(var(--lh) - 0.3mm), var(--rule) var(--lh));
      outline: none;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0 0.5mm;
    }
    .notes-content.overflow { box-shadow: inset 0 -2px 0 #D6964A; }

    .foot { display: flex; justify-content: center; align-items: center; height: 9mm; }
    .foot img { height: 8.5mm; width: auto; display: block; }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body {
        background: #FFFFFF !important;
        width: 210mm; height: 297mm;
        margin: 0 !important; padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .toolbar { display: none !important; }
      .page { margin: 0 !important; box-shadow: none !important; page-break-after: avoid; page-break-inside: avoid; }
      .cell.overflow, .notes-content.overflow { box-shadow: none; }
      .cell:focus { background: none; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-group">
      <label>فونت متن: <select id="fontMain"></select></label>
      <label>فونت عنوان: <select id="fontTitle"></select></label>
      <label>فونت روزها: <select id="fontDecor"></select></label>
      <label>اندازه‌ی متن:
        <input type="range" id="fontScale" min="0.8" max="1.25" step="0.05" value="1" />
        <span id="scaleVal">۱۰۰٪</span>
      </label>
    </div>
    <div class="toolbar-group">
      <button type="button" id="btnExport" title="برنامه را به‌صورت فایل روی دستگاه ذخیره می‌کند">ذخیره در فایل</button>
      <label class="btn-file" for="importFile" title="یک فایل برنامه‌ی ذخیره‌شده را باز می‌کند">باز کردن فایل</label>
      <input type="file" id="importFile" accept=".json,application/json" />
      <button type="button" id="btnClear">برنامه‌ی جدید</button>
      <button type="button" class="btn-primary" onclick="window.print()">چاپ / ذخیره‌ی PDF</button>
      <span id="saveStatus" class="save-status"></span>
    </div>
  </div>

  <main class="page" id="chartPage">
    <svg class="deco tr" viewBox="0 0 280 220" fill="none" stroke="#C9B6A5" stroke-width="1.2" opacity="0.7">
      <path d="M280 30 C 200 40, 150 90, 60 70 S -10 120, 0 160" />
      <path d="M280 55 C 210 70, 170 120, 90 105 S 20 150, 30 210" />
    </svg>
    <svg class="deco bl" viewBox="0 0 320 240" fill="none" stroke="#C9B6A5" stroke-width="1.2" opacity="0.7">
      <path d="M320 40 C 230 50, 180 100, 90 80 S 10 130, 20 180" />
      <path d="M320 70 C 240 85, 200 135, 120 120 S 40 165, 50 230" />
    </svg>

    <header class="head">
      <h1 class="main-title" contenteditable="true" data-key="title">برنامه غذایی</h1>
      <div class="sub-title" contenteditable="true" data-key="subtitle">هفتگی</div>
      <div class="info">
        <div class="info-field"><span class="info-label">نام:</span><div class="info-value" contenteditable="true" data-key="name"></div></div>
        <div class="info-field"><span class="info-label">هدف:</span><div class="info-value" contenteditable="true" data-key="goal"></div></div>
        <div class="info-field"><span class="info-label">قد:</span><div class="info-value" contenteditable="true" data-key="height"></div></div>
        <div class="info-field"><span class="info-label">وزن:</span><div class="info-value" contenteditable="true" data-key="weight"></div></div>
        <div class="info-field"><span class="info-label ltr">BMI:</span><div class="info-value" contenteditable="true" data-key="bmi"></div></div>
      </div>
      <div class="divider"><span></span></div>
    </header>

    <section class="days" id="days" aria-label="برنامه‌ی روزهای هفته"></section>

    <footer class="foot"><img src="logo.png" alt="Trim – NACM Yoga" /></footer>
  </main>

  <script>
    // ---------- فهرست فونت‌ها ----------
    const FONTS = [
      { id: 'iransans', name: 'ایران‌سنس', css: "'F-IRANSans'" },
      { id: 'yekan',    name: 'یکان',      css: "'F-Yekan'" },
      { id: 'shabnam',  name: 'شبنم',      css: "'F-Shabnam'" },
      { id: 'pinar',    name: 'پینار',     css: "'F-Pinar'" },
      { id: 'lotus',    name: 'لوتوس',     css: "'F-Lotus'" },
      { id: 'nazanin',  name: 'نازنین',    css: "'F-Nazanin'" },
      { id: 'titr',     name: 'تیتر',      css: "'F-Titr'", noBody: true },
      { id: 'tahoma',   name: 'تاهوما (سیستمی)', css: 'Tahoma' }
    ];
    const FALLBACK = ", 'F-IRANSans', Tahoma, sans-serif";
    const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const toEn = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.');

    // ---------- ساخت کارت‌ها ----------
    const DAYS  = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
    const MEALS = ['صبحانه','میان‌وعده','ناهار','میان‌وعده','شام'];
    let html = '';
    DAYS.forEach((day, d) => {
      html += `<article class="card"><h2 class="card-title">${day}</h2>`;
      MEALS.forEach((m, r) => {
        html += `<div class="meal"><span class="meal-label">${m}</span><div class="cell" contenteditable="true" data-key="d${d}_m${r}"></div></div>`;
      });
      html += `</article>`;
    });
    html += `<article class="card notes"><h2 class="card-title">توصیه‌ها</h2><div class="notes-content" contenteditable="true" data-key="notes"></div></article>`;
    document.getElementById('days').innerHTML = html;

    // ---------- فونت‌ها ----------
    const sel = { main: document.getElementById('fontMain'), title: document.getElementById('fontTitle'), decor: document.getElementById('fontDecor') };
    FONTS.forEach(f => {
      if (!f.noBody) sel.main.add(new Option(f.name, f.id));
      sel.title.add(new Option(f.name, f.id));
      sel.decor.add(new Option(f.name, f.id));
    });
    const cssOf = id => (FONTS.find(f => f.id === id) || FONTS[0]).css + FALLBACK;
    function applyFonts() {
      const r = document.documentElement.style;
      r.setProperty('--font-main', cssOf(sel.main.value));
      r.setProperty('--font-title', cssOf(sel.title.value));
      r.setProperty('--font-decor', cssOf(sel.decor.value));
      if (document.fonts) document.fonts.ready.then(() => setTimeout(checkOverflow, 50));
      setTimeout(checkOverflow, 600);
    }
    Object.values(sel).forEach(s => s.addEventListener('change', () => { applyFonts(); save(); }));

    // ---------- اندازه‌ی متن ----------
    const fontScale = document.getElementById('fontScale');
    const scaleVal = document.getElementById('scaleVal');
    function applyScale() {
      document.documentElement.style.setProperty('--font-scale', fontScale.value);
      scaleVal.textContent = toFa(Math.round(fontScale.value * 100)) + '٪';
      checkOverflow();
    }
    fontScale.addEventListener('input', () => { applyScale(); save(); });

    // ---------- محاسبه‌ی خودکار BMI ----------
    const $ = k => document.querySelector(`[data-key="${k}"]`);
    let bmiManual = false;
    $('bmi').addEventListener('input', () => { bmiManual = $('bmi').innerText.trim() !== ''; });
    function autoBMI() {
      if (bmiManual) return;
      let h = parseFloat(toEn($('height').innerText).replace(/[^\d.]/g, ''));
      const w = parseFloat(toEn($('weight').innerText).replace(/[^\d.]/g, ''));
      if (!h || !w) { $('bmi').innerText = ''; return; }
      if (h > 3) h = h / 100;               // سانتی‌متر به متر
      const bmi = w / (h * h);
      $('bmi').innerText = (bmi > 8 && bmi < 80) ? toFa(bmi.toFixed(1)).replace('.', '٫') : '';
    }

    // ---------- داده‌ها ----------
    const fields = () => document.querySelectorAll('[data-key]');
    const KEEP = ['title', 'subtitle'];
    function collect() {
      const data = { v: 2, fontMain: sel.main.value, fontTitle: sel.title.value, fontDecor: sel.decor.value, scale: fontScale.value, bmiManual, fields: {} };
      fields().forEach(el => { data.fields[el.dataset.key] = el.innerText.replace(/\n$/, ''); });
      return data;
    }
    function fill(data) {
      if (!data) return;
      if (data.fontMain) sel.main.value = data.fontMain;
      if (data.fontTitle) sel.title.value = data.fontTitle;
      if (data.fontDecor) sel.decor.value = data.fontDecor;
      if (data.scale) fontScale.value = data.scale;
      bmiManual = !!data.bmiManual;
      fields().forEach(el => {
        const v = data.fields && data.fields[el.dataset.key];
        if (typeof v === 'string') el.innerText = v;
        else if (!KEEP.includes(el.dataset.key)) el.innerText = '';
      });
      applyFonts(); applyScale();
    }

    const STORE = 'nutrition-plan-v2';
    const status = document.getElementById('saveStatus');
    let timer;
    function save() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        try { localStorage.setItem(STORE, JSON.stringify(collect())); status.textContent = 'ذخیره شد ✓'; }
        catch (e) { status.textContent = 'ذخیره‌ی خودکار در دسترس نیست'; }
      }, 400);
    }
    document.addEventListener('input', e => {
      const el = e.target.closest && e.target.closest('[data-key]');
      if (!el) return;
      if (el.dataset.key === 'height' || el.dataset.key === 'weight') autoBMI();
      status.textContent = '…'; save(); checkOverflow();
    });

    // چسباندن متن بدون قالب‌بندی
    document.addEventListener('paste', e => {
      const el = e.target.closest && e.target.closest('[contenteditable]');
      if (!el) return;
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
    });
    // اینتر در خانه‌های یک‌خطی کار نکند
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches && e.target.matches('.info-value, .main-title, .sub-title')) e.preventDefault();
    });

    // هشدار سرریز
    function checkOverflow() {
      document.querySelectorAll('.cell, .notes-content').forEach(el => {
        el.classList.toggle('overflow', el.scrollHeight > el.clientHeight + 1);
      });
    }
    window.addEventListener('resize', checkOverflow);

    // ---------- فایل ----------
    document.getElementById('btnExport').addEventListener('click', () => {
      const data = collect();
      const name = (data.fields.name || 'برنامه').trim().replace(/[\\/:*?"<>|]/g, '') || 'برنامه';
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `برنامه-غذایی_${name}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    document.getElementById('importFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try { fill(JSON.parse(await file.text())); save(); status.textContent = 'فایل باز شد ✓'; }
      catch (err) { status.textContent = 'این فایل برنامه‌ی معتبری نیست'; }
      e.target.value = '';
    });
    document.getElementById('btnClear').addEventListener('click', () => {
      if (!confirm('همه‌ی نوشته‌ها پاک شود؟ اگر لازم داری، اول «ذخیره در فایل» را بزن.')) return;
      fields().forEach(el => { if (!KEEP.includes(el.dataset.key)) el.innerText = ''; });
      bmiManual = false; save(); checkOverflow();
    });

    // ---------- شروع ----------
    sel.main.value = 'iransans'; sel.title.value = 'pinar'; sel.decor.value = 'lotus';
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    if (saved) fill(saved); else { applyFonts(); applyScale(); }
  </script>
</body>
</html>
