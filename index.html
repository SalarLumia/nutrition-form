<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برنامه تغذیه و رژیم غذایی</title>

  <style>
    /* =====================================================================
       فونت‌ها: همه از پوشه‌ی fonts کنار همین فایل خوانده می‌شوند،
       پس روی لینک گیت‌هاب برای هر کسی بدون نصب فونت کار می‌کنند.
       مرورگر هر فونت را فقط وقتی انتخاب شد دانلود می‌کند.
       ===================================================================== */

    /* ایران‌سنس: اگر روی سیستم نصب باشد از همان، وگرنه از پوشه‌ی fonts */
    @font-face { font-family: 'F-IRANSans'; font-weight: 100 200; font-display: swap;
      src: local('IRANSans UltraLight'), local('IRANSans-UltraLight'), url('fonts/iransans-200.woff2') format('woff2'), url('fonts/IRANSans_UltraLight.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 300; font-display: swap;
      src: local('IRANSans Light'), local('IRANSans-Light'), url('fonts/iransans-300.woff2') format('woff2'), url('fonts/IRANSans_Light.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 400; font-display: swap;
      src: local('IRANSans'), local('IRANSansWeb'), url('fonts/iransans-400.woff2') format('woff2'), url('fonts/IRANSans.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 500 600; font-display: swap;
      src: local('IRANSans Medium'), local('IRANSans-Medium'), url('fonts/iransans-500.woff2') format('woff2'), url('fonts/IRANSans_Medium.ttf') format('truetype'); }
    @font-face { font-family: 'F-IRANSans'; font-weight: 700 900; font-display: swap;
      src: local('IRANSans Bold'), local('IRANSans-Bold'), url('fonts/iransans-700.woff2') format('woff2'), url('fonts/IRANSans_Bold.ttf') format('truetype'); }

    /* یکان و نازنین یک وزن دارند؛ مرورگر نسخه‌ی پررنگ را خودش می‌سازد */
    @font-face { font-family: 'F-Yekan'; font-weight: 400; font-display: swap;
      src: url('fonts/yekan-400.woff2') format('woff2'); }

    /* شبنم */
    @font-face { font-family: 'F-Shabnam'; font-weight: 300; font-display: swap; src: url('fonts/shabnam-300.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 400; font-display: swap; src: url('fonts/shabnam-400.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 500 600; font-display: swap; src: url('fonts/shabnam-500.woff2') format('woff2'); }
    @font-face { font-family: 'F-Shabnam'; font-weight: 700 900; font-display: swap; src: url('fonts/shabnam-700.woff2') format('woff2'); }

    /* پینار: متغیر (وزن ۳۰۰ تا ۹۰۰) */
    @font-face { font-family: 'F-Pinar'; font-weight: 300 900; font-display: swap;
      src: url('fonts/pinar-vf.woff2') format('woff2'); }

    /* لوتوس */
    @font-face { font-family: 'F-Lotus'; font-weight: 400; font-display: swap; src: url('fonts/lotus-400.woff2') format('woff2'); }
    @font-face { font-family: 'F-Lotus'; font-weight: 700; font-display: swap; src: url('fonts/lotus-700.woff2') format('woff2'); }

    /* نازنین: یک وزن */
    @font-face { font-family: 'F-Nazanin'; font-weight: 400; font-display: swap; src: url('fonts/nazanin-400.woff2') format('woff2'); }

    /* تیتر: فقط برای عنوان */
    @font-face { font-family: 'F-Titr'; font-weight: 100 900; font-display: swap; src: url('fonts/titr-700.woff2') format('woff2'); }

    :root {
      --font-main: 'F-IRANSans', 'F-Shabnam', Tahoma, sans-serif;
      --font-title: 'F-IRANSans', 'F-Shabnam', Tahoma, sans-serif;
      --font-scale: 1;

      --bg-page: #F6F7F6;
      --bg-card: #F2F4F2;
      --bg-cell: #FFFFFF;
      --green-header: #8FA96D;
      --gray-header: #D4D7D4;
      --border-color: #9BA39B;
      --border-strong: #7E877E;
      --text-title: #2B3626;
      --text-dark: #1A1D1A;
      --text-muted: #4A524A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--font-main);
      background-color: #E5E7E5;
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* نوار ابزار (در چاپ مخفی) */
    .toolbar {
      font-family: 'F-Shabnam', Tahoma, sans-serif;
      max-width: 297mm;
      margin: 14px auto 10px;
      padding: 10px 16px;
      background: #FFFFFF;
      border: 1px solid #D0D5D0;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar label { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }

    .toolbar button, .toolbar select, .toolbar .btn-file {
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: #F4F6F4;
      color: var(--text-dark);
      cursor: pointer;
    }
    .toolbar select { font-weight: 500; padding: 6px 8px; }
    .toolbar button:hover, .toolbar .btn-file:hover { background: #E7ECE7; }
    .toolbar button.btn-primary { background: var(--green-header); border-color: #779156; color: #141A10; }
    .toolbar button.btn-primary:hover { background: #829D60; }
    .toolbar input[type="file"] { display: none; }
    .save-status { font-size: 11.5px; color: #4E6636; min-width: 9em; }

    /* صفحه A4 افقی */
    .page {
      width: 297mm;
      height: 210mm;
      margin: 0 auto 24px;
      padding: 9mm 11mm;
      background-color: var(--bg-page);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      gap: 4.5mm;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    .page * { font-family: inherit; }

    .main-title {
      font-family: var(--font-title) !important;
      text-align: center;
      font-size: calc(27pt * var(--font-scale));
      font-weight: 800;
      color: var(--text-title);
      line-height: 1.25;
      margin-bottom: 0.5mm;
      outline: none;
    }

    .user-info-bar {
      display: grid;
      grid-template-columns: 2.3fr 2fr 1fr 1fr 1fr;
      align-items: center;
      gap: 4mm;
      background-color: var(--bg-card);
      border: 1.3px solid var(--border-strong);
      border-radius: 10px;
      padding: 3.2mm 5mm;
      min-height: 13mm;
    }
    .info-field { display: flex; align-items: center; gap: 2mm; min-width: 0; }
    .info-label { font-size: calc(12pt * var(--font-scale)); font-weight: 700; white-space: nowrap; }
    .info-label.ltr { direction: ltr; unicode-bidi: isolate; }
    .info-value {
      flex: 1;
      min-height: 6mm;
      font-size: calc(11pt * var(--font-scale));
      font-weight: 500;
      outline: none;
      border-bottom: 1px dashed transparent;
      padding: 0 2px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
    }
    .info-value:focus { border-bottom-color: var(--green-header); background: rgba(255,255,255,0.7); border-radius: 3px; }

    .schedule-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 33mm repeat(7, 1fr);
      grid-template-rows: 11.5mm repeat(7, 1fr);
      gap: 2.2mm;
      min-height: 0;
    }
    .day-header, .meal-header {
      color: var(--text-dark);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      text-align: center;
      user-select: none;
    }
    .day-header { background-color: var(--green-header); font-size: calc(12.5pt * var(--font-scale)); }
    .meal-header { background-color: var(--gray-header); font-size: calc(11.5pt * var(--font-scale)); padding: 0 2mm; }

    .cell {
      background-color: var(--bg-cell);
      border: 1.2px solid var(--border-color);
      border-radius: 7px;
      padding: 1.5mm 2.2mm;
      font-size: calc(9pt * var(--font-scale));
      font-weight: 400;
      line-height: 1.35;
      outline: none;
      overflow: hidden;
      word-break: break-word;
      white-space: pre-wrap;
      min-height: 0;
    }
    .cell:focus { border-color: #6B874B; box-shadow: inset 0 0 0 1px #8FA96D; }
    /* هشدار سرریز: متنی که در خانه جا نمی‌شود (فقط روی صفحه، نه در چاپ) */
    .cell.overflow { border-color: #C0812C; box-shadow: inset 0 -3px 0 #E0A85A; }

    .notes-box {
      background-color: var(--bg-card);
      border: 1.3px solid var(--border-strong);
      border-radius: 10px;
      padding: 2.8mm 4.5mm;
      height: 24mm;
      display: flex;
      flex-direction: column;
      gap: 1.5mm;
    }
    .notes-title { font-size: calc(11pt * var(--font-scale)); font-weight: 800; }
    .notes-content {
      flex: 1;
      font-size: calc(9.5pt * var(--font-scale));
      line-height: 1.45;
      outline: none;
      overflow: hidden;
      white-space: pre-wrap;
    }

    /* ردیف پایین: لوگو در گوشه‌ی پایین راست، هم‌ستون با سرستون وعده‌ها */
    .bottom-row { display: grid; grid-template-columns: 33mm 1fr; gap: 2.2mm; height: 24mm; }
    .bottom-row .notes-box { height: 100%; }
    .logo-box { display: flex; align-items: center; justify-content: center; padding: 0 1mm; }
    .logo-box img { width: 100%; height: auto; max-height: 100%; object-fit: contain; display: block; }

    @page { size: A4 landscape; margin: 0; }

    @media print {
      html, body {
        background: #FFFFFF !important;
        width: 297mm; height: 210mm;
        margin: 0 !important; padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .toolbar { display: none !important; }
      .page { margin: 0 !important; box-shadow: none !important; page-break-after: avoid; page-break-inside: avoid; }
      .cell.overflow { border-color: var(--border-color); box-shadow: none; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-group">
      <label>فونت متن:
        <select id="fontMain"></select>
      </label>
      <label>فونت عنوان:
        <select id="fontTitle"></select>
      </label>
      <label>اندازه‌ی متن:
        <input type="range" id="fontScale" min="0.8" max="1.25" step="0.05" value="1" />
        <span id="scaleVal">۱۰۰٪</span>
      </label>
    </div>

    <div class="toolbar-group">
      <span id="saveStatus" class="save-status"></span>
      <button type="button" id="btnExport" title="برنامه را به‌صورت فایل روی دستگاه ذخیره می‌کند">ذخیره در فایل</button>
      <label class="btn-file" for="importFile" title="یک فایل برنامه‌ی ذخیره‌شده را باز می‌کند">باز کردن فایل</label>
      <input type="file" id="importFile" accept=".json,application/json" />
      <button type="button" id="btnClear">برنامه‌ی جدید</button>
      <button type="button" class="btn-primary" onclick="window.print()">چاپ / ذخیره‌ی PDF</button>
    </div>
  </div>

  <main class="page" id="chartPage">
    <h1 class="main-title" contenteditable="true" data-key="title">برنامه تغذیه و رژیم غذایی</h1>

    <section class="user-info-bar" aria-label="اطلاعات کاربر">
      <div class="info-field"><span class="info-label">نام و نام خانوادگی:</span><div class="info-value" contenteditable="true" data-key="name"></div></div>
      <div class="info-field"><span class="info-label">هدف رژیم:</span><div class="info-value" contenteditable="true" data-key="goal"></div></div>
      <div class="info-field"><span class="info-label">قد:</span><div class="info-value" contenteditable="true" data-key="height"></div></div>
      <div class="info-field"><span class="info-label">وزن:</span><div class="info-value" contenteditable="true" data-key="weight"></div></div>
      <div class="info-field"><span class="info-label ltr">BMI:</span><div class="info-value" contenteditable="true" data-key="bmi"></div></div>
    </section>

    <section class="schedule-grid" id="grid" aria-label="جدول برنامه تغذیه هفتگی"></section>

    <div class="bottom-row">
      <div class="logo-box"><img src="logo.png" alt="Trim – NACM Yoga" /></div>
      <section class="notes-box" aria-label="توضیحات و توصیه‌های پزشک یا مشاور">
        <div class="notes-title">توضیحات و توصیه‌های پزشک/مشاور</div>
        <div class="notes-content" contenteditable="true" data-key="notes"></div>
      </section>
    </div>
  </main>

  <script>
    // ---------- فهرست فونت‌ها ----------
    const FONTS = [
      { id: 'iransans', name: 'ایران‌سنس', css: "'F-IRANSans'" },
      { id: 'yekan',    name: 'یکان',      css: "'F-Yekan'" },
      { id: 'shabnam',  name: 'شبنم',      css: "'F-Shabnam'" },
      { id: 'pinar',    name: 'پینار',     css: "'F-Pinar'" },
      { id: 'lotus',    name: 'لوتوس',     css: "'F-Lotus'" },
      { id: 'nazanin',  name: 'نازنین',    css: "'F-Nazanin'" },
      { id: 'titr',     name: 'تیتر (فقط عنوان)', css: "'F-Titr'", titleOnly: true },
      { id: 'tahoma',   name: 'تاهوما (سیستمی)', css: 'Tahoma' }
    ];
    const FALLBACK = ", 'F-Shabnam', Tahoma, sans-serif";
    const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

    // ---------- ساخت جدول ----------
    const DAYS  = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
    const MEALS = ['قبل صبحانه','صبحانه','میان‌وعده ۱','ناهار','میان‌وعده ۲','شام','بعد شام'];
    const grid = document.getElementById('grid');
    let html = '<div></div>' + DAYS.map(d => `<div class="day-header">${d}</div>`).join('');
    MEALS.forEach((m, r) => {
      html += `<div class="meal-header">${m}</div>`;
      DAYS.forEach((_, c) => { html += `<div class="cell" contenteditable="true" data-key="c${r}_${c}"></div>`; });
    });
    grid.innerHTML = html;

    // ---------- انتخاب فونت ----------
    const selMain = document.getElementById('fontMain');
    const selTitle = document.getElementById('fontTitle');
    FONTS.forEach(f => {
      if (!f.titleOnly) selMain.add(new Option(f.name, f.id));
      selTitle.add(new Option(f.name, f.id));
    });
    function applyFonts() {
      const m = FONTS.find(f => f.id === selMain.value) || FONTS[0];
      const t = FONTS.find(f => f.id === selTitle.value) || FONTS[0];
      document.documentElement.style.setProperty('--font-main', m.css + FALLBACK);
      document.documentElement.style.setProperty('--font-title', t.css + FALLBACK);
      if (document.fonts) document.fonts.ready.then(() => setTimeout(checkOverflow, 50));
      setTimeout(checkOverflow, 600);
    }
    selMain.addEventListener('change', () => { applyFonts(); save(); });
    selTitle.addEventListener('change', () => { applyFonts(); save(); });

    // ---------- اندازه‌ی متن ----------
    const fontScale = document.getElementById('fontScale');
    const scaleVal = document.getElementById('scaleVal');
    function applyScale() {
      document.documentElement.style.setProperty('--font-scale', fontScale.value);
      scaleVal.textContent = toFa(Math.round(fontScale.value * 100)) + '٪';
      checkOverflow();
    }
    fontScale.addEventListener('input', () => { applyScale(); save(); });

    // ---------- داده‌ها ----------
    const fields = () => document.querySelectorAll('[data-key]');
    function collect() {
      const data = { v: 1, fontMain: selMain.value, fontTitle: selTitle.value, scale: fontScale.value, fields: {} };
      fields().forEach(el => { data.fields[el.dataset.key] = el.innerText.replace(/\n$/, ''); });
      return data;
    }
    function fill(data) {
      if (!data) return;
      if (data.fontMain) selMain.value = data.fontMain;
      if (data.fontTitle) selTitle.value = data.fontTitle;
      if (data.scale) fontScale.value = data.scale;
      fields().forEach(el => {
        const v = data.fields && data.fields[el.dataset.key];
        if (typeof v === 'string') el.innerText = v;
        else if (el.dataset.key !== 'title') el.innerText = '';
      });
      applyFonts(); applyScale();
    }

    // ذخیره‌ی خودکار در همین مرورگر
    const STORE = 'nutrition-plan-v1';
    const status = document.getElementById('saveStatus');
    let timer;
    function save() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        try { localStorage.setItem(STORE, JSON.stringify(collect())); status.textContent = 'ذخیره شد ✓'; }
        catch (e) { status.textContent = 'ذخیره‌ی خودکار در دسترس نیست'; }
      }, 400);
    }
    document.addEventListener('input', e => {
      if (e.target.closest && e.target.closest('[data-key]')) { status.textContent = '…'; save(); checkOverflow(); }
    });

    // چسباندن متن بدون قالب‌بندی
    document.addEventListener('paste', e => {
      const el = e.target.closest && e.target.closest('[contenteditable]');
      if (!el) return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    // اینتر در خانه‌های یک‌خطی کار نکند
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches && e.target.matches('.info-value, .main-title')) e.preventDefault();
    });

    // هشدار سرریز خانه‌ها
    function checkOverflow() {
      document.querySelectorAll('.cell, .notes-content').forEach(el => {
        el.classList.toggle('overflow', el.scrollHeight > el.clientHeight + 1);
      });
    }
    window.addEventListener('resize', checkOverflow);
    document.fonts && document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', checkOverflow);

    // ---------- فایل ----------
    document.getElementById('btnExport').addEventListener('click', () => {
      const data = collect();
      const name = (data.fields.name || 'برنامه').trim().replace(/[\\/:*?"<>|]/g, '') || 'برنامه';
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `برنامه-تغذیه_${name}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    document.getElementById('importFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try { fill(JSON.parse(await file.text())); save(); status.textContent = 'فایل باز شد ✓'; }
      catch (err) { status.textContent = 'این فایل برنامه‌ی معتبری نیست'; }
      e.target.value = '';
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      if (!confirm('همه‌ی نوشته‌ها پاک شود؟ اگر لازم داری، اول «ذخیره در فایل» را بزن.')) return;
      fields().forEach(el => { if (el.dataset.key !== 'title') el.innerText = ''; });
      save(); checkOverflow();
    });

    // ---------- شروع ----------
    selMain.value = 'iransans'; selTitle.value = 'iransans';
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    if (saved) fill(saved); else { applyFonts(); applyScale(); }
  </script>
</body>
</html>
